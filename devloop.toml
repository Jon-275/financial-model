[framework]
version = "0.11"

[pr]
max_lines = 800
exclude = ["workbook/*.xlsm", "workbook/*.xlsx", "docs/examples/*.pdf", "changes/*.*.md", "CHANGELOG.md"]

[agents]
tools = ["codex"]
skills_targets = [".agents/skills"]
commit_attribution = false

[skills]
include = ["devloop-setup"]
project = "devloop/skills"

[changelog]
code = ["tools/*", "workbook/*", "site/*", ".github/workflows/*", "devloop.toml"]
