name: Repository drift

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: repository-drift-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  drift:
    uses: Jon-275/dev-loop/.github/workflows/drift-check.yml@59714a76d9919c544151806e15c3cae6854a9a79
    with:
      devloop: git+https://github.com/Jon-275/dev-loop@59714a76d9919c544151806e15c3cae6854a9a79
