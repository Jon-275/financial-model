name: Dev-loop pilot

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  hygiene:
    uses: Jon-275/dev-loop/.github/workflows/pr-hygiene.yml@99aabeeb1b7cd30bfb709d3e69a5ae24c3086d2a
    with:
      devloop: git+https://github.com/Jon-275/dev-loop@99aabeeb1b7cd30bfb709d3e69a5ae24c3086d2a
