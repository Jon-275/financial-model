name: Dev-loop pilot

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  hygiene:
    uses: Jon-275/dev-loop/.github/workflows/pr-hygiene.yml@017bc7c1e3bee10ee79461345dd20d30f9495f30
    with:
      devloop: git+https://github.com/Jon-275/dev-loop@017bc7c1e3bee10ee79461345dd20d30f9495f30
