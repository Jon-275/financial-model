name: Dev-loop pilot

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  hygiene:
    uses: Jon-275/dev-loop/.github/workflows/pr-hygiene.yml@1e8fc4c86fab7bc87fe6fb2575276deee8cd342f # v0.10.0
    with:
      devloop: git+https://github.com/Jon-275/dev-loop@1e8fc4c86fab7bc87fe6fb2575276deee8cd342f
