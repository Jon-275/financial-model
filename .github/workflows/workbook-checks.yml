name: Financial model CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workbook-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: tools
  RISK_TEST_WORKBOOK: workbook/retirement-model.xlsm

jobs:
  structure_and_reports:
    name: Workbook structure and reports
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Test Gemini review outcomes
        run: node --test tests/gemini_review.test.mjs
      - name: Test workbook content privacy
        run: python -m unittest discover -s tests -p 'test_workbook_privacy.py'
      - name: Check tracked workbooks for private data
        run: python tools/check_workbook_commit.py --tracked
      - name: Check the published workbook
        run: python tests/model_acceptance.py --release workbook/retirement-model.xlsm
      - name: Install Python dependencies
        run: python -m pip install -r tools/requirements.txt pypdf==6.21.4 pdfplumber==0.11.9
      - name: Test workbook fixture and standalone script portability
        run: |
          python -m unittest discover -s tests -p 'test_xlsx_fixtures.py'
          env -u PYTHONPATH python tests/test_native_capture_pairs.py
          env -u PYTHONPATH python tests/test_macro_runner_contract.py
      - name: Verify the embedded runner matches its published source
        run: python -c 'import os; from package_macro import verify_project; verify_project(os.environ["RISK_TEST_WORKBOOK"])'
      - name: Verify the calculation order against workbook formulas
        run: python tests/native_order_acceptance.py "$RISK_TEST_WORKBOOK"
      - name: Run financial, report and runner tests
        run: |
          python -m unittest discover -s tests -p 'test_risk_*.py'
          python -m unittest discover -s tests -p 'test_native_*.py'
          python -m unittest discover -s tests -p 'test_macro_runner_contract.py'
          python -m unittest discover -s tests -p 'test_report_structure.py'
          python -m unittest discover -s tests -p 'test_prepare_example_pdf.py'
          python -m unittest discover -s tests -p 'test_decision_layout.py'
          python -m unittest discover -s tests -p 'test_workbook_protection.py'
          python tests/workbook_protection_acceptance.py "$RISK_TEST_WORKBOOK"
      - name: Install LibreOffice Calc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc
          soffice --version
      - name: Verify survivor income and medical costs
        run: python tests/survivor_floor_acceptance.py "$RISK_TEST_WORKBOOK"
      - name: Verify market results and report formulas
        run: |
          python tests/report_formula_acceptance.py
          python tests/native_integrity_acceptance.py
          python tests/native_closing_acceptance.py "$RISK_TEST_WORKBOOK"
          python tests/native_flexible_policy_acceptance.py "$RISK_TEST_WORKBOOK"
          python tests/native_capture_acceptance.py "$RISK_TEST_WORKBOOK" --codes pairs
          python tests/native_capture_acceptance.py "$RISK_TEST_WORKBOOK" --codes 1,1001,2205

  inputs_and_healthcare:
    name: Workbook inputs and healthcare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Install LibreOffice Calc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc
          soffice --version
      - name: Check input validation in Calc
        run: |
          python tests/input_validation_acceptance.py
          python tests/phase_readiness_acceptance.py "$RISK_TEST_WORKBOOK"
      - name: Verify Marketplace credits under variable inflation
        run: python tests/aca_inflation_acceptance.py "$RISK_TEST_WORKBOOK"

  one_time_expenses:
    name: Workbook one-time expenses
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Install LibreOffice Calc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc
          soffice --version
      - name: Verify one-time expenses in market trials
        run: python tests/one_time_expense_acceptance.py "$RISK_TEST_WORKBOOK"

  scenarios:
    name: Workbook representative scenarios
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Install LibreOffice Calc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc
          soffice --version
      - name: Recalculate representative scenarios
        run: |
          python tests/xlsx_acceptance.py workbook/retirement-model.xlsm tests/phase2-fixtures.json --compact --ledger \
            --case full_horizon_to125_dashboard \
            --case late_shortfall_reaches_dashboard \
            --case report_explains_missing_retirement_age \
            --case invalid_age126 \
            --case targeting_aca_cliff_preserves_earliest_fundable_branch \
            --case wage_growth_includes_inflation_and_stops_at_retirement \
            --case hsa_uses_its_own_mix_in_both_stages \
            --case working_year_cost_uses_roth_ira_basis \
            --case partial_roth_basis_leaves_visible_spending_obligation \
            --case unpaid_spending_rolls_forward_without_double_counting \
            --case later_cash_repays_prior_spending_before_deposits \
            --case confirmed_qualified_workplace_roth_available_while_working
          python tests/xlsx_acceptance.py workbook/retirement-model.xlsm tests/phase2-fixtures.json --compact --ledger \
            --case legacy_medical_surcharge_allows_negative_joint_magi \
            --case legacy_medical_surcharge_allows_negative_single_magi \
            --case complete_brokerage_liquidation_removes_its_cost_basis \
            --case partial_brokerage_sale_retains_only_its_share_of_investment_income \
            --case liquidated_brokerage_reopens_with_only_the_new_deposit_basis \
            --case unsold_brokerage_retains_income_and_new_deposits \
            --case social_security_does_not_fall_after_claim_during_deflation \
            --case existing_social_security_benefit_keeps_its_opening_level
          python tests/xlsx_acceptance.py workbook/retirement-model.xlsm tests/phase3-fixtures.json --compact --ledger

  workbook:
    # Keep this check name stable for the main branch ruleset.
    name: Workbook checks
    needs: [structure_and_reports, inputs_and_healthcare, one_time_expenses, scenarios]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require each workbook job to succeed
        env:
          STRUCTURE: ${{ needs.structure_and_reports.result }}
          INPUTS: ${{ needs.inputs_and_healthcare.result }}
          EXPENSES: ${{ needs.one_time_expenses.result }}
          SCENARIOS: ${{ needs.scenarios.result }}
        run: |
          printf '%s\n' "Structure and reports: $STRUCTURE" "Inputs and healthcare: $INPUTS" \
            "One-time expenses: $EXPENSES" "Representative scenarios: $SCENARIOS"
          if [[ "$STRUCTURE" != success || "$INPUTS" != success ||
                "$EXPENSES" != success || "$SCENARIOS" != success ]]; then
            echo '::error::Every workbook job must succeed.'
            exit 1
          fi
