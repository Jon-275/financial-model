name: Gemini 4 Hydrogen PR Review

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      pull-request:
        description: Pull request number
        type: number
        required: true

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  review:
    name: Run Gemini reviewer
    if: github.ref == 'refs/heads/main' && (github.event.action != 'edited' || github.event.changes.base.ref)
    concurrency:
      group: gemini-review-${{ github.event.pull_request.number || inputs['pull-request'] }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the trusted reviewer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Review the diff and publish a result on the PR commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const { resolve } = require('node:path');
            const { pathToFileURL } = require('node:url');
            const moduleUrl = pathToFileURL(resolve('tools/gemini_review.mjs')).href;
            const { reviewPullRequest } = await import(moduleUrl);
            await reviewPullRequest({ github, context, core, apiKey: process.env.GEMINI_API_KEY });
